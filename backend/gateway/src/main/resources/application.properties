# ==================== Gateway Configuration ====================
# Gateway server port
server.port=8080

# Application name
spring.application.name=gateway

# ==================== Service URLs ====================
# These are the backend services that gateway routes to
# Make sure these services are running on these ports

# Auth Service: Handles authentication (registration, login)
auth.service.url=http://localhost:8081

# Movie Service: Handles movie operations
movie.service.url=http://localhost:8082

# Review Service: Handles review operations
review.service.url=http://localhost:8083

# ==================== JWT Configuration ====================
# Same secret key as in authservice (for validation)
app.jwt.secret=mySecretKeyForJWTTokenGenerationChangeMeInProduction12345678

# JWT expiration time in milliseconds (24 hours)
app.jwt.expiration=86400000

# ==================== Logging Configuration ====================
# Log level for Spring Boot
logging.level.root=INFO
logging.level.com.cineverse.gateway=DEBUG

# Gateway-specific logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG

# ==================== Spring Cloud Gateway Configuration ====================
# Enable the gateway
spring.cloud.gateway.enabled=true

# HTTP encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
