# ==================== PostgreSQL Database Configuration ====================
# Database URL - change 'authservice_db' to your database name
spring.datasource.url=jdbc:postgresql://localhost:5432/authservice_db

# Database username
spring.datasource.username=postgres

# Database password (change this to your PostgreSQL password)
spring.datasource.password=password

# PostgreSQL driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA/Hibernate Configuration ====================
# Automatically create database tables based on Entity definitions
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (helpful for debugging)
spring.jpa.show-sql=true

# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Database dialect (tells Hibernate which SQL syntax to use)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== Application Configuration ====================
# Application name
spring.application.name=AuthService

# Server port
server.port=8080

# ==================== JWT Configuration ====================
# Secret key for signing JWT tokens (use a strong random key in production)
# Example: Change this to a long random string in production
app.jwt.secret=mySecretKeyForJWTTokenGenerationChangeMeInProduction12345678

# JWT expiration time in milliseconds (24 hours = 86400000 ms)
app.jwt.expiration=86400000

# ==================== Logging Configuration ====================
# Set log level for Spring Boot
logging.level.root=INFO
logging.level.com.cineverse.authservice=DEBUG

# Enable SQL parameter logging (shows actual values instead of ?)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
