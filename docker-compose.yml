# =============================================================
# CineVerse - Full Stack Docker Compose
# =============================================================
# Services:
#   Infrastructure: postgres, mongodb, redis
#   Backend:        auth-service, movie-service, booking-service
#   Frontend:       frontend (nginx)
# =============================================================

networks:
  cineverse-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  movie-uploads:

services:

  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: cineverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: authservice_db,cineverse_booking
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    ports:
      - "5432:5432"
    networks:
      - cineverse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: cineverse-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cineverse_movies
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - cineverse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cineverse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - cineverse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # BACKEND SERVICES
  # ─────────────────────────────────────────

  auth-service:
    build:
      context: ./backend/authservice
      dockerfile: Dockerfile
    container_name: cineverse-auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authservice_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: mySecretKeyForJWTTokenGenerationChangeMeInProduction12345678
      APP_JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cineverse-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' && echo OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  movie-service:
    build:
      context: ./backend/movie-service
      dockerfile: Dockerfile
    container_name: cineverse-movie-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/cineverse_movies
      FILE_UPLOAD_DIR: /app/uploads/
    volumes:
      - movie-uploads:/app/uploads
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cineverse-network

  booking-service:
    build:
      context: ./backend/booking-service
      dockerfile: Dockerfile
    container_name: cineverse-booking-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cineverse_booking
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MOVIE_SERVICE_URL: http://movie-service:8082
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cineverse-network

  # ─────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cineverse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - movie-service
      - booking-service
    networks:
      - cineverse-network
